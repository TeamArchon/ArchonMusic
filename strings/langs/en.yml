start_3 : "<blockquote><b>Hᴇʏ {0}</b> 🥀\n\nTʜᴀɴᴋs Fᴏʀ Aᴅᴅɪɴɢ <b>{1}</b> Tᴏ <b>{2}</b> — Eᴠᴇʀʏᴛʜɪɴɢ Is Rᴇᴀᴅʏ Fᴏʀ Yᴏᴜʀ Nᴇxᴛ Lɪsᴛᴇɴɪɴɢ Sᴇssɪᴏɴ 🎉\n\n<b>{3}</b> Is Rᴇᴀᴅʏ Tᴏ Bʀɪɴɢ Mᴜsɪᴄ Tᴏ Tʜɪs Cʜᴀᴛ. Sᴛᴀʀᴛ A Vᴏɪᴄᴇ Cʜᴀᴛ Aɴᴅ Sᴇɴᴅ <b>/ᴘʟᴧʏ</b> + Sᴏɴɢ Nᴀᴍᴇ 🎶</blockquote>"
